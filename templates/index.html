<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ college_name }} | Student Result Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-blob blob1"></div>
  <div class="auth-blob blob2"></div>

  <div class="landing">
    <div class="landing-hero glass-card fade-in">
      <i class="fa-solid fa-graduation-cap landing-icon"></i>
      <h1>Student Result Management System</h1>
      <p>A modern, secure platform to manage students, subjects, marks and
         results &mdash; with instant GPA calculation and printable report cards.</p>
      <div class="landing-actions">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Admin Login
        </a>
      </div>
      <div class="landing-features">
        <div><i class="fa-solid fa-bolt"></i><span>Auto Grade &amp; GPA</span></div>
        <div><i class="fa-solid fa-file-invoice"></i><span>Printable Report Cards</span></div>
        <div><i class="fa-solid fa-chart-pie"></i><span>Live Analytics</span></div>
      </div>
    </div>
  </div>
</body>
</html>
