<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | {{ college_name }}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-blob blob1"></div>
  <div class="auth-blob blob2"></div>

  <div id="toast-container" class="toast-container"></div>

  <div class="auth-wrap">
    <div class="auth-card glass-card fade-in">
      <div class="auth-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <h2>Welcome Back</h2>
      <p class="auth-sub">Sign in to manage {{ college_name }}</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
              <i class="fa-solid {{ 'fa-circle-check' if category=='success' else 'fa-circle-exclamation' if category=='error' else 'fa-triangle-exclamation' }}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" class="js-validate">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" required autofocus placeholder="admin">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button type="button" class="toggle-pw" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
      </form>

      <p class="auth-hint">Default credentials: <code>admin</code> / <code>admin123</code></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
