{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add New Student{% endblock %}

{% block content %}
<div class="glass-card form-card">
  <form method="POST" enctype="multipart/form-data" class="js-validate">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Ananya Rao">
      </div>
      <div class="form-group">
        <label for="roll_number">Roll Number *</label>
        <input type="text" id="roll_number" name="roll_number" required placeholder="e.g. 23CS045">
      </div>
      <div class="form-group">
        <label for="department">Department *</label>
        <select id="department" name="department" required>
          <option value="">Select Department</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Information Science</option>
          <option>Electrical</option>
        </select>
      </div>
      <div class="form-group">
        <label for="semester">Semester *</label>
        <select id="semester" name="semester" required>
          <option value="">Select Semester</option>
          {% for i in range(1, 9) %}
          <option value="Semester {{ i }}">Semester {{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="section">Section</label>
        <input type="text" id="section" name="section" placeholder="e.g. A">
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="student@example.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>
      <div class="form-group">
        <label for="photo">Profile Photo</label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('students') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Student</button>
    </div>
  </form>
</div>
{% endblock %}
